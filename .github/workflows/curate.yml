
name: Curate sports headlines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - curator.py
      - run_all.py
      - config*.json
      - tests/**
      - .github/workflows/curate.yml
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
      timezone: 'Europe/Athens'

permissions:
  contents: write

concurrency:
  group: sports-rss-curator
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test curators
        run: python -m unittest discover -s tests -v

      - name: Build curated RSS
        id: build
        continue-on-error: true
        run: python run_all.py

      - name: Save RSS and state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/feed.xml state.json
          for profile in news apple; do
            if [ -f "docs/$profile.xml" ]; then git add "docs/$profile.xml"; fi
            if [ -f "state-$profile.json" ]; then git add "state-$profile.json"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update curated sports RSS'
            git push
          fi


      - name: Report partial source-group failure
        if: steps.build.outcome == 'failure'
        run: exit 1
